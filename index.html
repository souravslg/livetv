<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Telegram-cricXfootball</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="referrer" content="no-referrer"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.css"/>
  <style>
    body { background:#000; margin:0; overflow:hidden; }
    html, body { height:100%; }
    video { width:100%; height:100%; }
    .plyr { height:100%; }
  </style>
</head>
<body>

<video id="player" autoplay muted controls crossorigin playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
<script src="premium.js"></script>
  
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const video = document.getElementById('player');
    const localProxy = '/api/proxy?url=';
    const fallbackProxy = 'https://corsproxy.io/?';

    // Parse stream ID from query parameters
    const urlParams = new URLSearchParams(window.location.search);
    let streamId = urlParams.get('id');

    if (!streamId || !streamMap[streamId]) {
      streamId = 'U2'; // Default to U2 stream if none specified
    }

    const streamInfo = streamMap[streamId];
    let streamUrl = streamInfo.url;
    
    // Decode URL if it is encoded
    if (streamUrl.startsWith('http%3A%2F%2F') || streamUrl.startsWith('https%3A%2F%2F')) {
      streamUrl = decodeURIComponent(streamUrl);
    }

    function initPlayer(currentProxy) {
      console.log('Initializing player with proxy:', currentProxy);
      
      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          xhrSetup: function(xhr, url) {
            // Avoid double-proxying
            if (!url.includes('/api/proxy?url=') && !url.includes('corsproxy.io/?')) {
              xhr.open('GET', currentProxy + encodeURIComponent(url), true);
            }
          }
        });

        hls.loadSource(currentProxy + encodeURIComponent(streamUrl));
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          const player = new Plyr(video, {
            controls: [
              'play-large', 'play', 'progress', 'current-time', 
              'mute', 'volume', 'captions', 'settings', 
              'pip', 'airplay', 'fullscreen'
            ],
            autoplay: true
          });
          video.play().catch(err => {
            console.log('Autoplay blocked, user interaction required:', err);
          });
        });

        // Error handling for robust playback recovery
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn('Fatal network error occurred:', data);
                if (currentProxy === localProxy) {
                  console.warn('Local proxy failed. Switching to public CORS proxy...');
                  hls.destroy();
                  initPlayer(fallbackProxy);
                } else {
                  console.warn('Network error on fallback proxy. Attempting recovery...');
                  hls.startLoad();
                }
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('Fatal media error. Attempting recovery...');
                hls.recoverMediaError();
                break;
              default:
                console.error('Fatal unrecoverable error. Destroying HLS instance...');
                hls.destroy();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS support (Safari/iOS)
        video.src = streamUrl;
        const player = new Plyr(video, {
          controls: [
            'play-large', 'play', 'progress', 'current-time', 
            'mute', 'volume', 'captions', 'settings', 
            'pip', 'airplay', 'fullscreen'
          ],
          autoplay: true
        });
      }
    }

    // Start playback
    initPlayer(localProxy);
  });
</script>
</body>
</html>
