<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caze TV Live Stream | Watch Live Sports & Entertainment</title>
  <meta name="description" content="Watch Caze TV Live Stream in high quality. Enjoy live sports, football, world cup matches, and exclusive entertainment broadcasts.">
  <meta name="keywords" content="Caze TV, live stream, watch live, sports streaming, world cup live">
  <meta name="robots" content="index, follow">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Visually hidden but accessible h1 for SEO purposes */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Caze TV Live Stream</h1>
    <iframe 
      id="live-stream-player"
      title="Caze TV Live Stream Player"
      src="https://fifa-world-cup-live.pages.dev/caze-tv" 
      allow="autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" 
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
